[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cvboost-ai-backend"
version = "1.0.0"
description = "CVBoost AI — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.115.5",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.17",
    "aiofiles==23.2.1",

    # Pydantic v2
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",
    "email-validator==2.2.0",

    # Database
    "sqlalchemy==2.0.31",
    "alembic==1.13.2",
    "aiosqlite==0.20.0",
    "asyncpg==0.29.0",

    # Auth
    "passlib[argon2]==1.7.4",
    "python-jose[cryptography]==3.3.0",
    "argon2-cffi==23.1.0",

    # AI / LangChain
    "langchain==0.3.7",
    "langchain-google-genai==2.0.4",
    "langchain-community==0.3.7",
    "langgraph==0.2.38",
    "google-generativeai==0.8.3",
    "tavily-python==0.5.0",

    # PDF generation
    "weasyprint==62.3",
    "jinja2==3.1.4",

    # File parsing
    "pdfplumber==0.11.4",
    "PyMuPDF==1.24.11",
    "python-docx==1.1.2",
    "pytesseract==0.3.13",
    "Pillow==10.4.0",

    # HTTP client (SSRF-safe)
    "httpx==0.27.2",

    # Security & sanitization
    "bleach==6.1.0",
    "slowapi==0.1.9",

    # Email
    "aiosmtplib==3.0.1",

    # Utilities
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
    "orjson==3.10.7",
    "anyio==4.6.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.8",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "ruff==0.5.7",
    "bandit==1.7.10",
    "pip-audit==2.7.3",
    "pre-commit==3.8.0",
    "faker==26.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "PTH", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
addopts = "-v"

[tool.bandit]
exclude_dirs = ["app/tests"]
skips = ["B101"]
